<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VanguardConnect - Messages</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/pages.css">
  <link rel="stylesheet" href="assets/css/luxe.css">
</head>
<body>
  <div id="navbar"></div>
  <div class="layout row g-4">
    <aside class="col-lg-3 d-none d-lg-block" id="sidebar"></aside>
    <main class="col-lg-9">
      <div class="v-card chat">
        <div class="contacts"><p class="section-title px-2 pt-2">Contacts</p><div id="contacts"></div></div>
        <div class="chat-main">
          <div class="p-3 border-bottom fw-bold" id="chatTitle">Select a contact</div>
          <div class="msg-list" id="msgList"><p class="text-muted small m-auto">Choose a contact to open the chat.</p></div>
          <div class="chat-input d-none" id="chatInput"><form id="sendForm" class="d-flex gap-2 w-100"><input class="form-control" id="msgText" placeholder="Type a message" autocomplete="off"><button class="btn btn-primary px-4">Send</button></form></div>
        </div>
      </div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/layout.js"></script>
  <script>buildLayout("messages.html")</script>
  <script src="assets/js/messages.js"></script>
</body>
</html>
