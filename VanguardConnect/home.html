<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VanguardConnect - Home</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/home.css">
  <link rel="stylesheet" href="assets/css/luxe.css">
</head>
<body>
  <nav class="v-nav py-2">
    <div class="container-xl d-flex align-items-center gap-3">
      <button class="btn btn-soft d-lg-none" data-bs-toggle="offcanvas" data-bs-target="#menu">☰</button>
      <a class="navbar-brand d-flex align-items-center brand-title m-0" href="home.html"></span>VanguardConnect</a>
      <input class="form-control nav-search mx-auto d-none d-md-block" style="max-width:380px" placeholder="Search people, units, posts">
      <div class="ms-auto d-flex align-items-center gap-2">
        <button class="btn btn-soft" onclick="toggleTheme()" title="Toggle theme">🌓</button>
        <div class="dropdown">
          <button class="btn p-0" data-bs-toggle="dropdown"><div class="avatar" id="navAvatar"></div></button>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><a class="dropdown-item" href="profile.html">Profile</a></li>
            <li><button class="dropdown-item" onclick="logout()">Logout</button></li>
          </ul>
        </div>
      </div>
    </div>
  </nav>

  <!-- Mobile menu (offcanvas) reuses the same links -->
  <div class="offcanvas offcanvas-start" id="menu">
    <div class="offcanvas-header"><h5 class="brand-title">VanguardConnect</h5><button class="btn-close" data-bs-dismiss="offcanvas"></button></div>
    <div class="offcanvas-body" id="mobileLinks"></div>
  </div>

  <div class="layout row g-4">
    <!-- Left sidebar -->
    <aside class="col-lg-3 d-none d-lg-block">
      <div class="v-card p-2" id="sideLinks">
        <a class="side-link active" href="home.html">🏠 Home</a>
        <a class="side-link" href="friends.html">🤝 Friends</a>
        <a class="side-link" href="messages.html">💬 Messages</a>
        <a class="side-link" href="announcements.html">📢 Announcements</a>
      </div>
      <div class="v-card p-3 mt-3">
        <div class="small text-muted fw-bold mb-2">YOUR UNIT</div>
        <div class="fw-semibold" id="unitName"></div>
      </div>
    </aside>

    <!-- Feed -->
    <main class="col-lg-6">
      <div class="v-card p-3 mb-3">
        <div class="d-flex gap-2">
          <div class="avatar" id="postAvatar"></div>
          <textarea class="form-control" rows="2" placeholder="Share an update with your unit..."></textarea>
        </div>
        <div class="d-flex flex-wrap gap-2 mt-2">
          <select class="form-select form-select-sm w-auto"><option>General Post</option><option>Achievement</option><option>Training</option><option>Team Activity</option><option>Discussion</option><option>Moments</option><option>Friendly Alert</option></select>
          <select class="form-select form-select-sm w-auto"><option>Friends</option><option>Everyone</option></select>
          <button class="btn btn-primary btn-sm ms-auto px-4">Post</button>
        </div>
      </div>
      <div class="filter-row">
        <button class="btn active" data-cat="All">All</button>
        <button class="btn" data-cat="Announcement">Announcement</button>
        <button class="btn" data-cat="Achievement">Achievement</button>
        <button class="btn" data-cat="Training">Training</button>
        <button class="btn" data-cat="Moments">Moments</button>
      </div>
      <div id="feed"></div>
    </main>

    <!-- Right sidebar -->
    <aside class="col-lg-3 d-none d-lg-block">
      <div class="v-card p-3">
        <div class="small text-muted fw-bold mb-2">📌 PINNED</div>
        <div class="fw-semibold">Training Exercise</div>
        <div class="small text-muted">Annual exercise begins Monday.</div>
      </div>
    </aside>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    document.getElementById("navAvatar").textContent = initials(currentUser.name);
    document.getElementById("postAvatar").textContent = initials(currentUser.name);
    document.getElementById("unitName").textContent = currentUser.unit;
    document.getElementById("mobileLinks").innerHTML = document.getElementById("sideLinks").innerHTML;
  </script>
  <script src="assets/js/feed.js"></script>
</body>
</html>
