<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VanguardConnect - Friends</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/pages.css">
  <link rel="stylesheet" href="assets/css/luxe.css">
</head>
<body>
  <div id="navbar"></div>
  <div class="layout row g-4">
    <aside class="col-lg-3 d-none d-lg-block" id="sidebar"></aside>
    <main class="col-lg-9">
      <div class="v-card p-3 mb-3"><p class="section-title">Find people</p>
        <input class="form-control mb-2" id="search" placeholder="Search by name or username"><div id="results"></div></div>
      <div class="v-card p-3 mb-3"><p class="section-title">Pending requests</p><div id="pending"></div></div>
      <div class="v-card p-3 mb-3"><p class="section-title">Friends · rate: 😑 · 👍 · 🛡️</p><div id="friendsList"></div></div>
      <div class="v-card p-3"><p class="section-title">Ignored</p><div id="ignoredList"></div></div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/layout.js"></script>
  <script>buildLayout("friends.html")</script>
  <script src="assets/js/friends.js"></script>
</body>
</html>
